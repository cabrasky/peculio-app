apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - secrets.yaml
  - backend/deployment.yaml
  - backend/service.yaml
  - database/statefulset.yaml
  - database/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - ingress.yaml
  - pdb-backend.yaml
  - pdb-frontend.yaml
  - pdb-database.yaml

# Registry por defecto (NetBird .21) para cualquier entorno aplicado a mano;
# el pipeline CI sobreescribe newTag vía `kustomize edit set image`.
images:
  - name: peculio-backend
    newName: registry.cabrasky.net/peculio-backend
  - name: peculio-frontend
    newName: registry.cabrasky.net/peculio-frontend

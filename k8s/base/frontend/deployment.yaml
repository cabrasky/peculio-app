apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: peculio
  labels:
    app: peculio
    component: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: peculio
      component: frontend
  template:
    metadata:
      labels:
        app: peculio
        component: frontend
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: frontend
          image: peculio-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: apk
              mountPath: /usr/share/nginx/html/apk
              readOnly: true
      volumes:
        - name: apk
          hostPath:
            path: /opt/peculio-apk
            type: DirectoryOrCreate

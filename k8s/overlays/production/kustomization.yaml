apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: peculio

# Imágenes fijadas a un tag concreto (NO :latest) para despliegues reproducibles.
# Argo CD Image Updater reescribe estos newTag cuando el CI publica una versión nueva.
images:
  - name: peculio-backend
    newName: registry.cabrasky.net/peculio-backend
    newTag: 0.1.0-d703d30
  - name: peculio-frontend
    newName: registry.cabrasky.net/peculio-frontend
    newTag: 0.1.0-d703d30

commonLabels:
  environment: production

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: frontend

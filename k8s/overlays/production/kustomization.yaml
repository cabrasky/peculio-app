apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

namespace: peculio

# Imágenes fijadas a un tag concreto (NO :latest) para despliegues reproducibles.
# El nombre ya viene reescrito por la base (registry.cabrasky.net/...), así que
# aquí solo fijamos el newTag. Argo CD Image Updater reescribe este tag al publicar.
images:
  - name: registry.cabrasky.net/peculio-backend
    newTag: 0.1.0-54636df
  - name: registry.cabrasky.net/peculio-frontend
    newTag: 0.1.0-54636df

commonLabels:
  environment: production

patches:
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: backend
  - patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
    target:
      kind: Deployment
      name: frontend

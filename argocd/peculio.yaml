apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: peculio
  namespace: argocd
  annotations:
    # ── Argo CD Image Updater ────────────────────────────────────────────
    # Sigue los tags de versión (X.Y.Z-<sha>) del registro de unraid.
    # Cuando el CI publica una imagen nueva, Image Updater actualiza el tag
    # y hace commit al repo (write-back Git → GitOps puro).
    argocd-image-updater.argoproj.io/image-list: >-
      backend=registry.cabrasky.net/peculio-backend,
      frontend=registry.cabrasky.net/peculio-frontend
    argocd-image-updater.argoproj.io/backend.update-strategy: alphabetical
    argocd-image-updater.argoproj.io/backend.allow-tags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+-.*$"
    argocd-image-updater.argoproj.io/frontend.update-strategy: alphabetical
    argocd-image-updater.argoproj.io/frontend.allow-tags: "regexp:^[0-9]+\\.[0-9]+\\.[0-9]+-.*$"
    argocd-image-updater.argoproj.io/write-back-method: git
    argocd-image-updater.argoproj.io/git-branch: main
spec:
  project: default
  source:
    repoURL: https://github.com/cabrasky/peculio-app
    targetRevision: main
    path: k8s/overlays/production
  destination:
    # Cluster Hetzner prod (vía VPN NetBird, IP overlay). Namespace 'peculio'.
    server: https://100.111.166.119:6443
    namespace: peculio
  syncPolicy:
    # PROD en sync MANUAL: revisar diff antes de aplicar.
    syncOptions:
      - CreateNamespace=true

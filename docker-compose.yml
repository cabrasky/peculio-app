services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-peculio_user}
      POSTGRES_PASSWORD: ${DB_PASS:-peculio_password}
      POSTGRES_DB: ${DB_NAME:-peculio}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-peculio_user} -d ${DB_NAME:-peculio}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${DB_USER:-peculio_user}
      DB_PASS: ${DB_PASS:-peculio_password}

      APP_URL: http://backend:8000
      DB_HOST
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8121}
    ports:
      - "8000:8000"

  frontend:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8121:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
